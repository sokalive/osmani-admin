# Render Blueprint — static admin SPA (Vite).
# After merging to your production branch, ensure this service's branch in the dashboard
# matches (typically main). Apply via Dashboard → Blueprint → Link repository file.
#
# Reduces stale HTML at the CDN while keeping hashed /assets/* cacheable (immutable filenames).

services:
  - type: web
    name: osmani-admin-mpya
    runtime: static
    repo: https://github.com/sokalive/osmani-admin.git
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Hashed bundles — safe to cache aggressively (filename changes each build).
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # SPA shell — always revalidate so clients pick up new chunk references quickly.
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

  # Node API — persistent media uploads (attach disk + set UPLOAD_DIR to mountPath).
  # Sizing: Starter is the minimum plan that supports persistent disks (cannot downgrade to Free).
  # See docs/RENDER_SIZING.md. Keep instance count at 1 unless Metrics justify scaling up.
  - type: web
    name: osmani-admin-api
    runtime: node
    region: oregon
    plan: starter
    rootDir: server
    repo: https://github.com/sokalive/osmani-admin.git
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: UPLOAD_DIR
        value: /var/render/media
      - key: NODE_VERSION
        value: "20"
      # Set in Render dashboard to your Bunny pull zone (e.g. https://osmani-media.b-cdn.net)
      - key: BUNNY_CDN_BASE_URL
        sync: false
      - key: BASE_URL
        sync: false
      - key: SERVER_HEALTH_BACKGROUND_ENABLED
        value: "0"
      - key: PG_POOL_MAX
        value: "8"
      - key: STREAM_DELIVERY_MODE
        value: hybrid
      - key: DIRECT_STREAM_SIGNING_ENABLED
        value: "1"
      - key: STREAM_PLAYBACK_FORCE_PROXY
        value: "1"
      - key: DIRECT_STREAM_CUTOVER_ENABLED
        value: "0"
      - key: DIRECT_STREAM_ROLLOUT_PERCENT
        value: "0"
      - key: DIRECT_STREAM_SIGNING_SECRET
        sync: false
    disk:
      name: media-uploads
      mountPath: /var/render/media
      sizeGB: 1
