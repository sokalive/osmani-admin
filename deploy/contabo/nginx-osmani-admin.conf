# Osmani Admin — Contabo VPS (nginx :80 → Node API :10001 + static admin SPA).
# Install: bash deploy/contabo/apply-cutover.sh

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 144.91.117.90 _;

    client_max_body_size 32m;

    root /var/www/osmani-admin-api/dist;
    index index.html;

    # API — must precede SPA fallback.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:10001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Uploads — Bunny CDN (Contabo origin disk has no media files).
    location ^~ /uploads/ {
        proxy_pass https://osmanitv.b-cdn.net/uploads/;
        proxy_ssl_server_name on;
        proxy_set_header Host osmanitv.b-cdn.net;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location ^~ /stream-proxy {
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location ^~ /stream-direct {
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location ^~ /hls/seg {
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
