name: Contabo Measure Realtime Banner Sync

on:
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Measure banners_changed SSE latency on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 144.91.117.90
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            cd /var/www/osmani-admin-api/server
            node --input-type=module <<'EOF'
            import { createRequire } from 'node:module'
            const require = createRequire(import.meta.url)
            const { loadContaboPm2Env } = require('../deploy/contabo/loadPm2Env.cjs')
            const env = loadContaboPm2Env('/var/www/osmani-admin-api')
            const token = String(env.ADMIN_API_TOKEN || '').trim()
            if (!token) throw new Error('ADMIN_API_TOKEN missing on VPS')
            const base = 'http://127.0.0.1:10001'
            const headers = { 'x-admin-token': token, Accept: 'application/json' }

            const manage = await fetch(`${base}/api/banners/manage`, { headers }).then((r) => r.json())
            const list = Array.isArray(manage) ? manage : manage.banners || []
            const banner = list[0]
            if (!banner?.id) throw new Error('no banner for safe metadata bump')
            console.log('target_banner', { id: banner.id, title: banner.title })

            const beforeImg = String(banner.image || banner.imageUrl || '')
            const ac = new AbortController()
            const sseStarted = Date.now()
            const sseRes = await fetch(`${base}/api/sync/stream?topics=config`, {
              headers: { Accept: 'text/event-stream' },
              signal: ac.signal,
            })
            const reader = sseRes.body.getReader()
            const dec = new TextDecoder()
            let buf = ''
            // drain init snapshot quickly
            while (Date.now() - sseStarted < 3000) {
              const { value, done } = await reader.read()
              if (done) break
              buf += dec.decode(value, { stream: true })
              if (buf.includes('event: snapshot')) break
            }

            const putBody = {
              title: banner.title,
              description: banner.description ?? '',
              active: banner.active !== false && banner.isActive !== false,
              enabled: banner.enabled !== false && banner.isEnabled !== false,
              badge: banner.badge ?? '',
              badge_enabled: banner.badgeEnabled !== false && banner.badge_enabled !== false,
              badge_color: banner.badgeColor || banner.badge_color || '#FBBF24',
              badge_blink: Boolean(banner.badgeBlink ?? banner.badge_blink),
              badge_priority: Number(banner.badgePriority ?? banner.badge_priority) || 0,
              enable_countdown: Boolean(banner.enableCountdown ?? banner.enable_countdown),
              event_start: banner.eventStart ?? banner.event_start ?? null,
              event_end: banner.eventEnd ?? banner.event_end ?? null,
              redirect_channel_id: banner.redirectChannelId ?? banner.redirect_channel_id ?? null,
              sort_order: Number(banner.sortOrder ?? banner.sort_order) || 0,
              event_timer: Boolean(banner.useTimer ?? banner.eventTimer ?? banner.event_timer),
              daily_start: banner.startTime || banner.dailyStart || banner.daily_start || null,
              daily_end: banner.endTime || banner.dailyEnd || banner.daily_end || null,
              runtime_position: banner.runtime_position || banner.runtimePosition || 'below_categories',
              image: beforeImg.includes('/uploads/') ? new URL(beforeImg).pathname : beforeImg,
            }

            const t0 = Date.now()
            const putPromise = fetch(`${base}/api/banners/${banner.id}`, {
              method: 'PUT',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify(putBody),
            }).then(async (r) => ({ status: r.status, body: await r.json().catch(() => null) }))

            let sseLatencyMs = null
            const waitUntil = Date.now() + 8000
            while (Date.now() < waitUntil && sseLatencyMs == null) {
              const { value, done } = await reader.read()
              if (done) break
              buf += dec.decode(value, { stream: true })
              if (buf.includes('event: banners_changed') || buf.includes('event: banner_updated') || buf.includes('config.banners_changed')) {
                sseLatencyMs = Date.now() - t0
                break
              }
            }
            const put = await putPromise
            ac.abort()

            const after = await fetch(`${base}/api/banners`, { cache: 'no-store' }).then((r) => r.json())
            const row = (Array.isArray(after) ? after : []).find((x) => Number(x.id) === Number(banner.id))
            const afterImg = String(row?.image_url || row?.imageUrl || '')
            console.log(
              JSON.stringify(
                {
                  put_status: put.status,
                  sse_latency_ms: sseLatencyMs,
                  put_ms: Date.now() - t0,
                  image_before_has_v: /[?&]v=/.test(beforeImg),
                  image_after: afterImg.slice(0, 160),
                  image_after_has_v: /[?&]v=/.test(afterImg),
                  updated_at: row?.updated_at || row?.updatedAt || null,
                  url_unchanged_path:
                    beforeImg.split('?')[0].replace(/^https?:\/\/[^/]+/, '') ===
                    afterImg.split('?')[0].replace(/^https?:\/\/[^/]+/, ''),
                },
                null,
                2,
              ),
            )
            if (put.status < 200 || put.status >= 300) process.exit(2)
            if (sseLatencyMs == null) process.exit(3)
            if (sseLatencyMs > 2000) process.exit(4)
            EOF
