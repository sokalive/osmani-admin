name: Upsert Contabo Admin Auth Env

# One-shot: write ADMIN_* / RESEND_* secrets into VPS server/.env (values never echoed).
on:
  workflow_dispatch:

jobs:
  upsert:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert auth env on Contabo
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 144.91.117.90
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 5m
          envs: ADMIN_JWT_SECRET,ADMIN_LOGIN_PIN,ADMIN_SECURITY_PIN,ADMIN_PANEL_BOOTSTRAP_EMAIL,ADMIN_ALERT_EMAIL,RESEND_API_KEY,RESEND_FROM_EMAIL,ADMIN_LOGIN_EMAILS
          script: |
            set -euo pipefail
            cd /var/www/osmani-admin-api
            export ADMIN_TRUSTED_INSTALL=0
            export ADMIN_PANEL_AUTH_REQUIRED=true
            export ADMIN_PANEL_LEGACY_TOKEN_FALLBACK=false
            export ADMIN_JWT_SECRET
            export ADMIN_LOGIN_PIN
            export ADMIN_SECURITY_PIN
            export ADMIN_PANEL_BOOTSTRAP_EMAIL
            export ADMIN_ALERT_EMAIL
            export ADMIN_LOGIN_EMAILS
            export RESEND_API_KEY
            export RESEND_FROM_EMAIL
            bash deploy/contabo/upsert-admin-auth-env.sh
            pm2 restart osmani-admin-api --update-env
            sleep 3
            curl -fsS http://127.0.0.1:10001/api/admin/auth/status
            echo
        env:
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          ADMIN_LOGIN_PIN: ${{ secrets.ADMIN_LOGIN_PIN }}
          ADMIN_SECURITY_PIN: ${{ secrets.ADMIN_SECURITY_PIN }}
          ADMIN_PANEL_BOOTSTRAP_EMAIL: ${{ secrets.ADMIN_PANEL_BOOTSTRAP_EMAIL }}
          ADMIN_ALERT_EMAIL: ${{ secrets.ADMIN_ALERT_EMAIL }}
          ADMIN_LOGIN_EMAILS: ${{ secrets.ADMIN_LOGIN_EMAILS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
