name: Deploy Contabo

on:
  push:
    branches: [main]
    paths:
      - 'deploy/contabo/**'
      - 'server/**'
      - 'src/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Skip when CONTABO_SSH_KEY is not configured
        id: gate
        run: |
          if [ -z "${{ secrets.CONTABO_SSH_KEY }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CONTABO_SSH_KEY not set — skipping VPS deploy. Run pull-and-apply.sh on the VPS console."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Contabo VPS
        if: steps.gate.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 144.91.117.90
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /var/www/osmani-admin-api
            export CERTBOT_EMAIL="${CERTBOT_EMAIL:-admin@osmanitv.com}"
            bash deploy/contabo/pull-and-apply.sh
