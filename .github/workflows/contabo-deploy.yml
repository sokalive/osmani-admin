name: Deploy Contabo

on:
  push:
    branches: [main]
    paths:
      - 'deploy/contabo/**'
      - 'server/**'
      - 'src/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Skip when CONTABO_SSH_KEY is not configured
        id: gate
        env:
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          if [ -z "${CONTABO_SSH_KEY}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CONTABO_SSH_KEY not set — skipping VPS deploy. Run pull-and-apply.sh on the VPS console."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Contabo VPS
        if: steps.gate.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 144.91.117.90
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            ROOT=/var/www/osmani-admin-api
            cd "$ROOT"
            git fetch origin main
            git reset --hard origin/main
            COMMIT="$(git rev-parse HEAD)"
            echo "commit=$COMMIT"
            export OSMANI_GIT_COMMIT="$COMMIT"
            export OSMANI_ADMIN_ROOT="$ROOT"
            node "$ROOT/deploy/contabo/sync-database-url-env.cjs" "$ROOT" >/dev/null
            pm2 delete osmani-admin-api 2>/dev/null || true
            pm2 start "$ROOT/deploy/contabo/ecosystem.config.cjs" --update-env
            pm2 save
            for i in $(seq 1 150); do
              if curl -fsS "http://127.0.0.1:10001/api/health" >/tmp/h.json 2>/dev/null; then
                READY="$(node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{const j=JSON.parse(s);process.stdout.write(String(j.startup?.ready===true&&String(j.commit||'')==='$COMMIT'))}catch{process.stdout.write('false')}})" </tmp/h.json)"
                echo "probe $i ready=$READY $(head -c 350 /tmp/h.json)"
                if [ "$READY" = "true" ]; then
                  nginx -t && systemctl reload nginx || true
                  curl -fsSI https://api.osmanitv.com/api/health | head -5 || true
                  exit 0
                fi
              else
                echo "probe $i not up"
              fi
              sleep 2
            done
            echo "ERROR: API not ready" >&2
            pm2 logs osmani-admin-api --lines 80 --nostream || true
            exit 1

      - name: Checkout for post-deploy verification
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Verify VPS HTTPS endpoints
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          EXPECT="${{ github.sha }}"
          ok=0
          for attempt in $(seq 1 20); do
            curl -fsS "https://api.osmanitv.com/api/health" | tee /tmp/vps-health.json
            COMMIT="$(node -e "console.log(String(require('/tmp/vps-health.json').commit||''))")"
            echo "attempt $attempt commit=${COMMIT:0:12} expect=${EXPECT:0:12}"
            if [[ "${COMMIT:0:12}" == "${EXPECT:0:12}" ]]; then
              ok=1
              break
            fi
            sleep 15
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "ERROR: VPS commit did not match ${EXPECT:0:12} within readiness window" >&2
            exit 1
          fi
          curl -fsSI "https://api.osmanitv.com" | head -1 | grep -q "200"
          curl -fsSI "https://admin.osmanitv.com" | head -1 | grep -q "200"
          node -e "
            const h = require('/tmp/vps-health.json');
            if (!h.ok) { console.error('health not ok', h); process.exit(1); }
            if ((h.pool?.waitingCount ?? 0) > 50) {
              console.error('pool waitingCount too high after deploy', h.pool);
              process.exit(1);
            }
            console.log('VPS commit', String(h.commit || '').slice(0, 12), 'pool.waitingCount', h.pool?.waitingCount);
          "
          curl -fsS "https://api.osmanitv.com/api/runtime/cutover-status" | tee /tmp/vps-cutover.json
          node server/scripts/verify-vps-render-independence.mjs
