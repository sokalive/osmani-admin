name: Contabo Probe Direct HLS

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Skip when CONTABO_SSH_KEY is not configured
        id: gate
        env:
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          if [ -z "${CONTABO_SSH_KEY}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe Bein 1 HD Direct HLS from VPS egress
        if: steps.gate.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 144.91.117.90
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            echo "=== health commit ==="
            curl -fsS --max-time 15 https://api.osmanitv.com/api/health
            echo
            echo "=== probe from VPS ==="
            cd /var/www/osmani-admin-api/server
            node --input-type=module <<'EOF'
            const health = await fetch('https://api.osmanitv.com/api/channels').then((r) => r.json())
            const list = Array.isArray(health) ? health : health.channels || []
            const c = list.find((x) => x.name === 'Bein 1 HD')
            if (!c) throw new Error('Bein 1 HD not found')
            function asText(v, max = 4000) {
              return String(v ?? '').trim().slice(0, max)
            }
            function probeOriginHeader(value) {
              const s = asText(value, 4000)
              if (!s.startsWith('http://') && !s.startsWith('https://')) return ''
              try {
                const u = new URL(s)
                return u.hostname ? `${u.protocol}//${u.host}` : ''
              } catch {
                return ''
              }
            }
            const MEDIA_UA =
              'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) ExoPlayerLib/2.19.1'
            function buildProbeHeaders(channel, extra = {}) {
              const referer = asText(channel?.referer, 4000)
              const origin = probeOriginHeader(channel?.origin)
              const ua = asText(channel?.userAgent, 500) || MEDIA_UA
              return {
                'User-Agent': ua,
                Accept: '*/*',
                Connection: 'keep-alive',
                ...(referer ? { Referer: referer } : {}),
                ...(origin ? { Origin: origin } : {}),
                ...extra,
              }
            }
            const bad = {
              'User-Agent': c.userAgent || MEDIA_UA,
              Accept: '*/*',
              Connection: 'keep-alive',
              Referer: c.referer,
              Origin: c.origin,
            }
            const good = buildProbeHeaders(c)
            async function once(label, method, headers, parse = false) {
              const started = Date.now()
              try {
                const res = await fetch(c.url, {
                  method,
                  redirect: 'follow',
                  headers,
                  signal: AbortSignal.timeout(10000),
                })
                let snip = ''
                if (parse) snip = (await res.text()).slice(0, 120)
                else {
                  try {
                    await res.arrayBuffer()
                  } catch {}
                }
                console.log(
                  JSON.stringify({
                    label,
                    method,
                    status: res.status,
                    ms: Date.now() - started,
                    ct: res.headers.get('content-type'),
                    originSent: headers.Origin || null,
                    snip: snip.replace(/\s+/g, ' ').slice(0, 100),
                  }),
                )
              } catch (e) {
                console.log(JSON.stringify({ label, method, error: String(e.message || e), ms: Date.now() - started }))
              }
            }
            console.log('channel_origin_field', c.origin)
            console.log('good_headers', good)
            await once('OLD_bad_origin', 'HEAD', bad)
            await once('NEW_fixed_origin', 'HEAD', good)
            await once('NEW_fixed_GET', 'GET', good, true)
            await once('NO_REFERER', 'GET', { 'User-Agent': good['User-Agent'], Accept: '*/*' }, true)
            await once('ACCEPT_MIME', 'GET', { ...good, Accept: 'application/vnd.apple.mpegurl,*/*' }, true)
            EOF
            echo "=== server-health Bein ==="
            curl -fsS --max-time 60 https://api.osmanitv.com/api/server-health | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const h=JSON.parse(d);console.log(JSON.stringify(h.channels.find(c=>c.name==='Bein 1 HD')||h,null,2))})"
