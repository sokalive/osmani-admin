name: Contabo Reload API

on:
  workflow_dispatch:

jobs:
  reload:
    runs-on: ubuntu-latest
    steps:
      - name: Skip when CONTABO_SSH_KEY is not configured
        id: gate
        env:
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
        run: |
          if [ -z "${CONTABO_SSH_KEY}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CONTABO_SSH_KEY not set — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reload API on Contabo VPS
        if: steps.gate.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 144.91.117.90
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /var/www/osmani-admin-api
            git fetch origin main
            git reset --hard origin/main
            bash deploy/contabo/reload-api-only.sh

      - name: Verify VPS health commit
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          EXPECT="${{ github.sha }}"
          ok=0
          for attempt in $(seq 1 20); do
            curl -fsS "https://api.osmanitv.com/api/health" | tee /tmp/vps-health.json
            COMMIT="$(node -e "console.log(String(require('/tmp/vps-health.json').commit||''))")"
            echo "attempt $attempt commit=${COMMIT:0:12} expect=${EXPECT:0:12}"
            if [[ "${COMMIT:0:12}" == "${EXPECT:0:12}" ]]; then
              ok=1
              break
            fi
            sleep 5
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "ERROR: VPS commit did not match ${EXPECT:0:12}" >&2
            exit 1
          fi
