name: Contabo Probe Stream Upstream

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Bein upstream from Contabo egress
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 144.91.117.90
          username: root
          key: ${{ secrets.CONTABO_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            URL='http://bein.mpilalivetv.com/bridge/bein-sports-1.m3u8?key=K2TV-791F'
            UA139='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36'
            echo '=== health ==='
            curl -fsS http://127.0.0.1:10001/api/health | head -c 250; echo
            echo '=== local proxy manifest ==='
            MANI=$(curl -sS -m 20 "http://127.0.0.1:10001/stream-proxy?url=$(python3 - <<'PY'
import urllib.parse
print(urllib.parse.quote('http://bein.mpilalivetv.com/bridge/bein-sports-1.m3u8?key=K2TV-791F', safe=''))
PY
)&referer=http%3A%2F%2Fbein.mpilalivetv.com%2F&userAgent=$(python3 - <<'PY'
import urllib.parse
print(urllib.parse.quote('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36', safe=''))
PY
)")
            echo "$MANI" | head -n 12
            SEG=$(echo "$MANI" | awk 'NF && $0 !~ /^#/ {print; exit}')
            echo "=== first proxied segment ==="
            echo "$SEG" | head -c 350; echo
            if [ -n "$SEG" ]; then
              curl -sS -m 20 -D /tmp/seg.hdr -o /tmp/seg.bin "$SEG" || true
              head -n 20 /tmp/seg.hdr || true
              echo "seg_bytes=$(wc -c </tmp/seg.bin)"
              head -c 16 /tmp/seg.bin | od -An -tx1 || true
              RAW=$(node -e "const u=process.argv[1]; process.stdout.write(new URL(u).searchParams.get('url')||'')" "$SEG")
              echo "=== direct RAW segment ==="
              echo "$RAW"
              curl -sS -m 15 -D /tmp/seg2.hdr -o /tmp/seg2.bin -A "$UA139" -e 'http://bein.mpilalivetv.com/' "$RAW" || true
              head -n 15 /tmp/seg2.hdr || true
              echo "direct_bytes=$(wc -c </tmp/seg2.bin)"
              head -c 16 /tmp/seg2.bin | od -An -tx1 || true
            fi
            echo '=== ssrf ==='
            curl -sS -m 10 -w 'status=%{http_code}\n' 'http://127.0.0.1:10001/stream-proxy?url=https://example.com/' || true
